<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>HYTrans Worker</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
    }
    .warning {
      margin: 0 0 12px;
      padding: 10px 12px;
      border: 1px solid #8a6424;
      border-radius: 6px;
      background: #211909;
      color: #ffd78a;
      font-size: 28px;
      line-height: 1.5;
    }
    .progress {
      width: 100%;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #2a2a2a;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: #4fa3ff;
      transition: width 160ms ease;
    }
    .progress-text {
      margin: 8px 0 12px;
      color: #b8c7d9;
      font-size: 13px;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <p class="warning">이 HYTransWorker 창을 닫으면 HYTrans와 연결이 끊겨 번역이 중단될 수 있습니다. 닫는 대신 최소화하세요.</p>
  <div class="progress" aria-hidden="true">
    <div id="progress-bar" class="progress-bar"></div>
  </div>
  <div id="progress-text" class="progress-text">모델 다운로드 준비 중...</div>
  <pre id="status">HYTrans worker starting...</pre>
  <script type="module" src="/assets/worker.js"></script>
</body>
</html>
